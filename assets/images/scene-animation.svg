<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1000 300" fill="none">
  <defs>
    <!-- Glow filter -->
    <filter id="gw" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Shared gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1a2235"/>
    </linearGradient>
    <radialGradient id="eg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- ── BONE shape, centered at (0,0) ── -->
    <g id="bn">
      <rect x="-20" y="-4" width="40" height="8" rx="4"
            fill="url(#bg)" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.92"/>
      <circle cx="-20" cy="0"  r="7" fill="url(#bg)" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.92"/>
      <circle cx="-14" cy="-6" r="5" fill="url(#bg)" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.92"/>
      <circle cx="-14" cy="6"  r="5" fill="url(#bg)" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.92"/>
      <circle cx="20"  cy="0"  r="7" fill="url(#bg)" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.92"/>
      <circle cx="14"  cy="-6" r="5" fill="url(#bg)" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.92"/>
      <circle cx="14"  cy="6"  r="5" fill="url(#bg)" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.92"/>
    </g>

    <!-- ── Bone flight arc: robot hand (throw) → dog mouth (facing left, at x=900) ── -->
    <!-- Robot shoulder (158,150) + arm 66px at 25° → hand ≈ (218,178)              -->
    <!-- Dog at (900,195), facing left, snout at (900−35,195−19) = (865,176)         -->
    <path id="arc" d="M 218 178 Q 532 14 865 176"/>

    <!-- ── DOG shape, centered at (0,0), FACING RIGHT (snout at +x) ── -->
    <g id="dog">
      <!-- Tail (left side for right-facing dog) -->
      <rect x="-36" y="-10" width="12" height="32" rx="6"
            fill="url(#bg)" stroke="#f59e0b" stroke-width="1.3" stroke-opacity="0.55"
            transform="rotate(-38,-30,6)"/>
      <circle cx="-49" cy="-20" r="4.5" fill="#f59e0b" opacity="0.72" filter="url(#gw)"/>
      <!-- Back legs -->
      <rect x="-28" y="52" width="18" height="36" rx="7"
            fill="url(#bg)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.3"/>
      <rect x="12"  y="52" width="18" height="36" rx="7"
            fill="url(#bg)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.3"/>
      <!-- Back feet -->
      <rect x="-34" y="80" width="28" height="10" rx="5"
            fill="url(#bg)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.28"/>
      <rect x="6"   y="80" width="28" height="10" rx="5"
            fill="url(#bg)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.28"/>
      <!-- Body -->
      <rect x="-36" y="8"  width="74" height="50" rx="10"
            fill="url(#bg)" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.42"/>
      <!-- Progress bar -->
      <rect x="-22" y="27" width="44" height="5" rx="2.5" fill="#f59e0b" opacity="0.08"/>
      <rect x="-22" y="27" width="28" height="5" rx="2.5" fill="#f59e0b" opacity="0.45"/>
      <!-- LED -->
      <circle cx="-18" cy="42" r="3.5" fill="#10b981" opacity="0.72" filter="url(#gw)"/>
      <!-- Front legs -->
      <rect x="-16" y="54" width="18" height="30" rx="7"
            fill="url(#bg)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.3"/>
      <rect x="4"   y="54" width="18" height="30" rx="7"
            fill="url(#bg)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.3"/>
      <!-- Front feet -->
      <rect x="-22" y="76" width="26" height="10" rx="5"
            fill="url(#bg)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.28"/>
      <rect x="-2"  y="76" width="26" height="10" rx="5"
            fill="url(#bg)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.28"/>
      <!-- Neck -->
      <rect x="-12" y="-2" width="28" height="14" rx="5"
            fill="url(#bg)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.22"/>
      <!-- Head (extends right for right-facing dog) -->
      <rect x="-16" y="-62" width="68" height="56" rx="12"
            fill="url(#bg)" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.52"/>
      <!-- Ear bolt (left side) -->
      <circle cx="-16" cy="-34" r="6" fill="url(#bg)" stroke="#f59e0b" stroke-width="1.3" stroke-opacity="0.45"/>
      <!-- Ears (top) -->
      <rect x="-12" y="-75" width="14" height="17" rx="4"
            fill="url(#bg)" stroke="#f59e0b" stroke-width="1.3" stroke-opacity="0.45"/>
      <rect x="22"  y="-75" width="14" height="17" rx="4"
            fill="url(#bg)" stroke="#f59e0b" stroke-width="1.3" stroke-opacity="0.45"/>
      <!-- Left eye socket — pupils shifted right (dog looks right) -->
      <rect x="-10" y="-52" width="22" height="17" rx="5" fill="#080c14"/>
      <circle cx="9"  cy="-43" r="6.5" fill="#f59e0b" opacity="0.85" filter="url(#gw)"/>
      <circle cx="9"  cy="-43" r="2.5" fill="#fff"/>
      <!-- Right eye socket -->
      <rect x="16"  y="-52" width="22" height="17" rx="5" fill="#080c14"/>
      <circle cx="35" cy="-43" r="6.5" fill="#f59e0b" opacity="0.85" filter="url(#gw)"/>
      <circle cx="35" cy="-43" r="2.5" fill="#fff"/>
      <!-- Eyebrows (raised — excited) -->
      <path d="M -10 -55 Q 2 -62 14 -55"  stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.88"/>
      <path d="M  16 -55 Q 28 -62 40 -55" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.88"/>
      <!-- Snout -->
      <rect x="14" y="-30" width="40" height="22" rx="8"
            fill="url(#bg)" stroke="#f59e0b" stroke-width="1.1" stroke-opacity="0.4"/>
      <circle cx="50" cy="-19" r="3.5" fill="#f59e0b" opacity="0.55"/>
      <!-- Tongue -->
      <path d="M 18 -8 Q 28 0 38 -8" stroke="#fb923c" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.88"/>
    </g>
  </defs>

  <!-- Ground glows -->
  <ellipse cx="100" cy="290" rx="90" ry="6" fill="#f59e0b" opacity="0.05"/>
  <ellipse cx="900" cy="290" rx="70" ry="6" fill="#f59e0b" opacity="0.05"/>

  <!-- ════════════════════════ ROBOT ════════════════════════ -->

  <!-- Left arm (static, hanging) -->
  <rect x="16" y="138" width="30" height="72" rx="10"
        fill="url(#bg)" stroke="#f59e0b" stroke-width="1.3" stroke-opacity="0.3"/>
  <circle cx="31" cy="214" r="14" fill="url(#bg)" stroke="#f59e0b" stroke-width="1.3" stroke-opacity="0.3"/>

  <!-- Feet -->
  <rect x="52"  y="274" width="34" height="13" rx="6.5"
        fill="url(#bg)" stroke="#f59e0b" stroke-width="1.3" stroke-opacity="0.3"/>
  <rect x="120" y="274" width="34" height="13" rx="6.5"
        fill="url(#bg)" stroke="#f59e0b" stroke-width="1.3" stroke-opacity="0.3"/>

  <!-- Body -->
  <rect x="44" y="146" width="116" height="132" rx="14"
        fill="url(#bg)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.45"/>
  <!-- Progress bar -->
  <rect x="62" y="168" width="80" height="6" rx="3" fill="#f59e0b" opacity="0.08"/>
  <rect x="62" y="168" width="50" height="6" rx="3" fill="#f59e0b" opacity="0.45"/>
  <!-- LEDs -->
  <circle cx="66" cy="194" r="4.5" fill="#10b981" opacity="0.72" filter="url(#gw)"/>
  <circle cx="82" cy="194" r="4.5" fill="#f59e0b" opacity="0.72" filter="url(#gw)"/>

  <!-- Neck -->
  <rect x="74" y="138" width="54" height="12" rx="5"
        fill="url(#bg)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Head -->
  <rect x="34" y="52" width="134" height="90" rx="16"
        fill="url(#bg)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.52"/>

  <!-- Antenna -->
  <rect x="97" y="30" width="6" height="26" rx="3"
        fill="url(#bg)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.62"/>
  <circle cx="100" cy="28" r="6" fill="#f59e0b" opacity="0.8" filter="url(#gw)"/>

  <!-- Left eye socket -->
  <rect x="44" y="68" width="48" height="36" rx="8" fill="#080c14"/>
  <circle cx="68" cy="86" r="14" fill="url(#eg)" opacity="0.35"/>
  <circle cx="68" cy="86" r="9"  fill="#f59e0b" opacity="0.85" filter="url(#gw)"/>
  <circle cx="68" cy="86" r="3.5" fill="#fff"/>
  <circle cx="66" cy="84" r="1.5" fill="#fff" opacity="0.72"/>

  <!-- Right eye socket -->
  <rect x="110" y="68" width="48" height="36" rx="8" fill="#080c14"/>
  <circle cx="134" cy="86" r="14" fill="url(#eg)" opacity="0.35"/>
  <circle cx="134" cy="86" r="9"  fill="#f59e0b" opacity="0.85" filter="url(#gw)"/>
  <circle cx="134" cy="86" r="3.5" fill="#fff"/>
  <circle cx="132" cy="84" r="1.5" fill="#fff" opacity="0.72"/>

  <!-- Wink line — covers right eye during throw phase (25%–34% of 12 s) -->
  <line x1="112" y1="86" x2="156" y2="86" stroke="#080c14" stroke-width="14" stroke-linecap="round">
    <animate attributeName="opacity"
      values="0; 0; 1; 1; 0; 0"
      keyTimes="0; 0.208; 0.25; 0.3; 0.34; 1"
      dur="12s" repeatCount="indefinite"/>
  </line>

  <!-- Mouth -->
  <path d="M 72 116 Q 100 124 128 116" stroke="#f59e0b" stroke-width="2"
        stroke-linecap="round" fill="none" opacity="0.38"/>

  <!-- RIGHT (THROWING) ARM — pivot at SVG (158, 150) -->
  <!-- At rest: 65° (arm down-right). Wind-up: −52° (arm up). Throw: 25° (forward). -->
  <g transform="translate(158,150)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="65; 65; -52; 25; 65; 65"
        keyTimes="0; 0.125; 0.208; 0.267; 0.34; 1"
        calcMode="spline"
        keySplines="0 0 1 1; 0.4 0 0.6 1; 0.85 0 0.15 1; 0.5 0 0.5 1; 0 0 1 1"
        dur="12s" repeatCount="indefinite"/>
      <rect x="0" y="-12" width="62" height="24" rx="11"
            fill="url(#bg)" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.38"/>
      <circle cx="66" cy="0" r="14"
              fill="url(#bg)" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.38"/>
    </g>
  </g>

  <!-- ════════════════════════ BONE (flying arc) ════════════════════════ -->
  <!-- Appears at throw (25% = 3 s), flies along arc, disappears at catch (41.7% = 5 s) -->
  <g>
    <use xlink:href="#bn" href="#bn"/>
    <animate attributeName="opacity"
      values="0; 0; 1; 1; 0; 0"
      keyTimes="0; 0.25; 0.267; 0.417; 0.44; 1"
      dur="12s" repeatCount="indefinite"/>
    <animateMotion rotate="auto" dur="12s" repeatCount="indefinite"
      keyPoints="0; 0; 0; 1; 1"
      keyTimes="0; 0.25; 0.267; 0.417; 1"
      calcMode="spline"
      keySplines="0 0 1 1; 0.3 0 0.7 1; 0.35 0 0.65 1; 0 0 1 1">
      <mpath xlink:href="#arc" href="#arc"/>
    </animateMotion>
  </g>

  <!-- ════════════════════════ DOG ════════════════════════ -->
  <!--
    Timeline (12 s loop):
      0  – 5 s  (0   – 41.7%): waiting on right at (900,195)
      5  – 7.5s (41.7– 62.5%): runs left to robot at (100,195)
      7.5– 8 s  (62.5– 66.7%): pause at robot
      8  –10.5s (66.7– 87.5%): runs right back to (900,195)
      10.5–12 s (87.5–100%  ): arrives, turns, waits

    Facing direction (discrete switch, no flicker gap):
      0 – 66.7%  : facing LEFT  (scale −1,1)  — waiting, catching, running to robot
      66.7– 90%  : facing RIGHT              — running back
      90 –100%   : facing LEFT               — turned, waiting again
  -->
  <g>
    <!-- Position animation -->
    <animateTransform attributeName="transform" type="translate"
      values="900,195; 900,195; 100,195; 100,195; 900,195; 900,195"
      keyTimes="0; 0.417; 0.625; 0.667; 0.875; 1"
      calcMode="spline"
      keySplines="0 0 1 1; 0.42 0 0.58 1; 0 0 1 1; 0.42 0 0.58 1; 0 0 1 1"
      dur="12s" repeatCount="indefinite"/>

    <!-- Facing LEFT (default — waiting + running to robot) -->
    <g transform="scale(-1,1)">
      <!-- Inner group provides the eager body bob -->
      <g>
        <use xlink:href="#dog" href="#dog"/>
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 0,-5; 0,0; 0,-5; 0,0"
          dur="0.5s" repeatCount="indefinite"/>
      </g>
      <!-- Discrete opacity: visible 0–66.7% and 90–100% -->
      <animate attributeName="opacity" calcMode="discrete"
        values="1; 0; 1"
        keyTimes="0; 0.667; 0.9"
        dur="12s" repeatCount="indefinite"/>
    </g>

    <!-- Facing RIGHT (running back) -->
    <g>
      <g>
        <use xlink:href="#dog" href="#dog"/>
        <!-- Running bob -->
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 0,-5; 0,0; 0,-5; 0,0"
          dur="0.5s" repeatCount="indefinite"/>
      </g>
      <!-- Discrete opacity: visible 66.7–90% only -->
      <animate attributeName="opacity" calcMode="discrete"
        values="0; 1; 0"
        keyTimes="0; 0.667; 0.9"
        dur="12s" repeatCount="indefinite"/>
    </g>

    <!-- Carry-bone — near left-facing dog's snout while dog runs to robot -->
    <!-- Dog center is at (900→100, 195); snout (facing left) ≈ (center−35, center−19) -->
    <!-- So translate(−54,−20) places bone just left of the dog's mouth              -->
    <g transform="translate(-54,-20) scale(0.62)">
      <use xlink:href="#bn" href="#bn"/>
      <!-- Visible only while dog runs to robot: 41.7–66.7% -->
      <animate attributeName="opacity" calcMode="discrete"
        values="0; 1; 0"
        keyTimes="0; 0.417; 0.667"
        dur="12s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
