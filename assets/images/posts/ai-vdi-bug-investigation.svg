<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <radialGradient id="vg-spot" cx="58%" cy="50%" r="28%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vg-blue" cx="14%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="vg-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="0.5" cy="0.5" r="0.9" fill="rgba(255,255,255,0.045)"/>
    </pattern>
    <clipPath id="vg-clip">
      <circle cx="696" cy="236" r="148"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="#080c14"/>
  <rect width="1200" height="480" fill="url(#vg-dots)"/>
  <rect width="1200" height="480" fill="url(#vg-blue)"/>
  <rect width="1200" height="480" fill="url(#vg-spot)"/>

  <!-- Log stream lines — the "noise" (dim, outside spotlight) -->
  <g font-family="monospace" font-size="11.5" fill="#64748b" opacity="0.18">
    <text x="24" y="94"> [INFO]  FSLogix profile: ATTACH success on WDES-W10-042</text>
    <text x="24" y="118">[INFO]  Group Policy: Applied successfully — 0.4s</text>
    <text x="24" y="142">[INFO]  Module loaded: Az.Accounts v2.12.1</text>
    <text x="24" y="166">[INFO]  Module loaded: Az.Accounts v2.13.2</text>
    <text x="24" y="190">[INFO]  Authentication token acquired (ADFS)</text>
    <text x="24" y="214">[INFO]  AppV: Package published — CitrixWorkspaceApp</text>
    <text x="24" y="238">[INFO]  UserProfile: Registry hive loaded (HKCU)</text>
    <text x="24" y="262">[INFO]  Session: Citrix ICA channel established</text>
    <text x="24" y="286">[INFO]  Citrix: Session 0x4A2 initialized — user OK</text>
    <text x="24" y="310">[INFO]  GPO: Software restriction policy applied</text>
    <text x="24" y="334">[INFO]  FSLogix: Container attached — 142ms</text>
    <text x="24" y="358">[INFO]  AppV: Sequence cache validated</text>
    <text x="24" y="382">[INFO]  Session: Ready — user profile active</text>
  </g>

  <!-- Log stream lines — INSIDE the spotlight (bright, readable) -->
  <g clip-path="url(#vg-clip)" font-family="monospace" font-size="11.5">
    <g fill="#94a3b8" opacity="0.72">
      <text x="24" y="94"> [INFO]  FSLogix profile: ATTACH success on WDES-W10-042</text>
      <text x="24" y="118">[INFO]  Group Policy: Applied successfully — 0.4s</text>
    </g>
    <!-- The two critical lines — highlighted amber -->
    <rect x="24" y="126" width="780" height="20" rx="3" fill="rgba(245,158,11,0.12)"/>
    <text x="24" y="141" fill="#fbbf24" opacity="0.95" font-weight="bold">[INFO]  Module loaded: Az.Accounts v2.12.1</text>
    <rect x="24" y="150" width="780" height="20" rx="3" fill="rgba(245,158,11,0.20)"/>
    <text x="24" y="165" fill="#f59e0b" opacity="1" font-weight="bold">[INFO]  Module loaded: Az.Accounts v2.13.2 ← DUPLICATE</text>
    <g fill="#94a3b8" opacity="0.72">
      <text x="24" y="190">[INFO]  Authentication token acquired (ADFS)</text>
      <text x="24" y="214">[INFO]  AppV: Package published — CitrixWorkspaceApp</text>
      <text x="24" y="238">[INFO]  UserProfile: Registry hive loaded (HKCU)</text>
      <text x="24" y="262">[INFO]  Session: Citrix ICA channel established</text>
      <text x="24" y="286">[INFO]  Citrix: Session 0x4A2 initialized — user OK</text>
    </g>
    <!-- Second highlighted finding -->
    <rect x="24" y="294" width="740" height="20" rx="3" fill="rgba(245,158,11,0.16)"/>
    <text x="24" y="309" fill="#fbbf24" opacity="0.9" font-weight="bold">[INFO]  Two Az.Accounts versions active simultaneously</text>
    <g fill="#94a3b8" opacity="0.72">
      <text x="24" y="334">[INFO]  FSLogix: Container attached — 142ms</text>
      <text x="24" y="358">[INFO]  AppV: Sequence cache validated</text>
    </g>
  </g>

  <!-- Spotlight circle ring -->
  <circle cx="696" cy="236" r="148" fill="none" stroke="rgba(245,158,11,0.40)" stroke-width="1.8"/>
  <circle cx="696" cy="236" r="157" fill="none" stroke="rgba(245,158,11,0.12)" stroke-width="1" stroke-dasharray="5 8"/>

  <!-- Magnifying glass handle -->
  <line x1="808" y1="348" x2="852" y2="394" stroke="rgba(245,158,11,0.45)" stroke-width="5" stroke-linecap="round"/>

  <!-- Right side — dim, post-signal data -->
  <g font-family="monospace" font-size="11.5" fill="#475569" opacity="0.10">
    <text x="900" y="190">...session active</text>
    <text x="900" y="240">...profile loaded</text>
    <text x="900" y="290">...auth complete</text>
  </g>

  <!-- Corner brackets -->
  <g fill="none" stroke="rgba(245,158,11,0.13)" stroke-width="2" stroke-linecap="round">
    <polyline points="36,36 36,22 50,22"/>
    <polyline points="1164,36 1164,22 1150,22"/>
    <polyline points="36,444 36,458 50,458"/>
    <polyline points="1164,444 1164,458 1150,458"/>
  </g>
</svg>
